name: ci

# Быстрые проверки на каждый push в main и каждый PR:
# версии во всех манифестах, документация, тесты демона в Docker,
# сборка архива плагина Noctalia.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      packages:
        description: "Собрать .rpm (Fedora, контейнер) — проверка упаковки"
        type: boolean
        default: false
      macos:
        description: "Собрать демон под macOS arm64 (macOS-раннер)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: версии
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сверить манифесты
        run: bash scripts/version.sh --check

  docs:
    name: документация
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # docs-check сравнивает время коммитов кода и доков
      - name: docs-check
        run: bash scripts/docs-check.sh
      - name: справочники (маршруты и состояние)
        run: bash scripts/docs-sync.sh --check
      - name: влияние на версию
        run: bash scripts/version-impact.sh >> "$GITHUB_STEP_SUMMARY"

  test:
    name: тесты (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: cargo test
        run: bash packaging/run-tests.sh -p ymd

  plugin:
    name: архив плагина
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать tar.gz
        run: bash packaging/build-noctalia.sh
      - name: Проверить содержимое
        run: |
          version=$(bash scripts/version.sh)
          archive="dist/yandex-music-plugin-${version}.tar.gz"
          test -f "$archive"
          tar tzf "$archive" | grep -qx './plugin.toml'
          echo "готово: $archive ($(stat -c%s "$archive") байт)"

  rpm:
    name: rpm (Fedora, вручную)
    if: github.event_name == 'workflow_dispatch' && inputs.packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Собрать .rpm демона, плазмоида и ymd-qt
        run: bash packaging/build-rpm.sh --arch amd64
      - name: Проверить пакеты
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          ls -lh dist/*.rpm
          for pkg in dist/*.rpm; do
            rpm -qp --qf '%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' "$pkg"
            rpm -qlp "$pkg" | head -5
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm
          if-no-files-found: error

  macos:
    name: macOS arm64 (вручную)
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Зависимости (GStreamer из Homebrew)
        run: |
          brew install pkgconf gstreamer gst-plugins-base gst-plugins-good
          brew --prefix gstreamer
      - name: Собрать демон
        env:
          PKG_CONFIG_PATH: ${{ env.HOMEBREW_PREFIX }}/lib/pkgconfig
        run: |
          cargo build --release -p ymd
          ./target/release/ymd --version
          ./target/release/ymd session-key | head -c 8; echo "…"
      - name: Проверить, что Linux-модули отключены
        run: |
          ./target/release/ymd doctor || true
