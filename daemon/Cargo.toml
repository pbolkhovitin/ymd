[package]
name = "ymd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Yandex Music daemon for the KDE Plasma 6 plasmoid"

[[bin]]
name = "ymd"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
thiserror = "2"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
md-5 = "0.10"
aes = "0.8"
ctr = "0.9"
hex = "0.4"
dirs = "6"
toml = "0.8"
gstreamer = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# D-Bus/MPRIS есть только на Linux: на macOS модуль mpris_server не собирается.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
